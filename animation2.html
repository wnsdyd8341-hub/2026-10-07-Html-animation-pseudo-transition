<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 목록 리스트</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }
        ul,li{
            list-style: none;
        }
        .container{
            width: 1200px;
            margin: 0px auto;
            padding: 10px;
            background-color: antiquewhite;
            text-align: center;
        }
        .container >h1{
            margin: 10px;
        }
        .product{
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .product li{
            flex: 1;
            position: relative;
        }
        .product img{
            width: 100%;
            display: block;
        }
        .caption{
            background-color: rgba(0,0,0,50%);
            width: 100%;
            height: 100%;
            color: #fff;
            position: absolute;
            top: 248px;
            left: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.3s;
            opacity: 0;
        }
        .caption h2{
            margin-bottom: 20px;
        }
        .product li:hover .caption{
            top: 0;
            opacity: 1;
        }
        



    </style>
</head>
<body>
    <div class="container">
        <h1>신상품 목록</h1>

        <ul class="product">
            <li>
                <img src="Image/images3/prod1.jpg" alt="">
                <div class="caption">
                    <h2>상품 1</h2>
                    <p>상품 1 설명 리스트</p>
                    <p>가격 : 12,345원</p>
                </div>
            </li>
            <li>
                <img src="Image/images3/prod2.jpg" alt="">
                <div class="caption">
                    <h2>상품 2</h2>
                    <p>상품 2 설명 리스트</p>
                    <p>가격 : 12,345원</p>
                </div>
            </li>
            <li><img src="Image/images3/prod3.jpg" alt="">
                <div class="caption">
                    <h2>상품 3</h2>
                    <p>상품 3 설명 리스트</p>
                    <p>가격 : 12,345원</p>
                </div>
            </li>
        </ul>
    </div>


</body>
</html>
