<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }
        .img_box{
            width: 300px;
            position: relative;
            
        }
        .img_box img{
            width: 100%;
            
        }
        
        .name{
            width: 100%;
            height: 100%;
            background-color:rgba(0,0,0,40%);
            position: absolute;
            top:0;
            left:0;
            opacity: 0;
        }
        .name p{
            position: absolute;
            top: 40%;
            left: 40%;
            color: #fff;
        }

        .img_box:hover .name{
            transition: all 3s ease-in-out;
            opacity:1;
        }
        .img_box .name p::after{
            content: '_';
            position:absolute;
            top: 6px;
            left: -10px;
        }

    </style>

</head>
<body>
    <div class="img_box">
        <img src="Image/KakaoTalk_20261007_105428761.jpg" alt="">
        <div class="name">
            <p>김준용</p>
        </div>

    </div>



</body>
</html>
