<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }
        .container{
            perspective: 100px;
        }
        .origin{
            width: 100px;
            height: 100px;
            border: 1px solid #333;
        }
        .movex{
            width: 100%;
            height: 100%;
            background-color: orange;
        }
        .movex:hover{
            transform: rotateY(45deg);
        }
        .movex>img{
            width: 100%;
        }
        
        
    </style>
</head>
<body>
    <div class="container">
        <div class="origin">
            <div class="movex">
                <img src="Image/KakaoTalk_20261007_093318802.jpg" alt="">
            </div>
        </div>
    </div>
    
</body>
</html>
