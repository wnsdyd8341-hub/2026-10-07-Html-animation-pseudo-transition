<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        .dog{
            width:400px;
            position: relative; 
            
            
        }
        .dog img{
            width: 100%;
            display: block;
        }
        .text{
            width: 100%;
            height: 100%;
            top: 50%;
            left: 50%;
            position: absolute;
            opacity: 0;
            
            color: #333;
        }

        .dog:hover .text{
            opacity: 1;
            
        }
        .text p::after{
            position: absolute;
            content:'';
            left: -10px;
        }
        
        
    </style>
  </head>
  <body>
    <div class="dog">
        <img src="Image/KakaoTalk_20261007_105428761.jpg" alt="" />

        <div class="text">
            <p>김준용</p>
        </div>
    </div>
  </body>
</html>
