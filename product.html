<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }
        header{
            background-color: rgba(3,3,3,20%);
            text-align: center;
            padding: 20px 100px;
            display: flex;
            justify-content: space-between;
        }
        ul,li{
            list-style: none;
        }
        a{
            text-decoration: none;
            color: #333;
        }
        
        .menu{
            width: 100%;
            background-color: aqua;
            display: flex;
            gap: 10px;
            flex: 1;
        }
        .menu>li{
            position: relative;
        }
        .menu>li>a{
            display: block;
            width: 100%;
        }
        .menu>li:hover .submenu{
            display: block;
        }
        .submenu{
            width: 100%;
            display: flex;
            flex-direction: column;
            transition: all 0.5s;
            position: absolute;
            top: 100%;
            background-color: burlywood;
            /* 이걸 해야 서브메뉴에 마우스가 올려질때 메뉴가 나옴  안적으면 밑에 올려도 메뉴가 나온다 */
            display: none;
        }

    </style>
</head>
<body>
    <!-- 상단 -->
    <header>
        <a href="#">logo</a>

        <nav>
            <ul class="menu">
                <li><a href="#">menu 01</a>
                    <ul class="submenu">
                        <li><a href="#">서브메뉴</a></li>
                        <li><a href="#">서브메뉴</a></li>
                        <li><a href="#">서브메뉴</a></li>
                        <li><a href="#">서브메뉴</a></li>
                    </ul>
                </li>
                <li><a href="#">menu 02</a>
                    <ul class="submenu">
                        <li><a href="#">서브메뉴</a></li>
                        <li><a href="#">서브메뉴</a></li>
                        <li><a href="#">서브메뉴</a></li>
                        <li><a href="#">서브메뉴</a></li>
                    </ul>
                </li>
                <li><a href="#">menu 03</a>
                    <ul class="submenu">
                        <li><a href="#">서브메뉴</a></li>
                        <li><a href="#">서브메뉴</a></li>
                        <li><a href="#">서브메뉴</a></li>
                        <li><a href="#">서브메뉴</a></li>
                    </ul>
                </li>
                <li><a href="#">menu 04</a>
                    <ul class="submenu">
                        <li><a href="#">서브메뉴</a></li>
                        <li><a href="#">서브메뉴</a></li>
                        <li><a href="#">서브메뉴</a></li>
                        <li><a href="#">서브메뉴</a></li>
                    </ul>
                </li>
                
            </ul>
        </nav>
    </header>
    <div class="container">


    </div>
</body>
</html>
